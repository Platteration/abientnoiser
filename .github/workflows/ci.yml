name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A named Ubuntu release, not ubuntu-latest, which moves to 26.04 from 2026-10-19: the
    # lockfile's Playwright 1.56.1 has no Chromium build for 26.04, and its browser install fails
    # there. Raising Playwright is what moves this on; test/ci.test.js holds the two in step.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strictly from the lockfile, so CI runs the version these tests were written against.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      # A static app: nothing to build. The musical and texture suites launch Chromium
      # themselves, so they follow the browser install.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:musical

      - run: npm run test:textures

      - run: npm run test:e2e

  # Its own job, so that an advisory published against an unchanged tree turns audit red
  # on the next run (on the default branch, the weekly one at the latest) and leaves check
  # meaning what it always meant. The shared gate runs npm audit --omit=dev, which reads the
  # lockfile (no install), and fails on every high or critical advisory that
  # .github/audit/accepted.json does not accept; this repository keeps no such list, so it
  # accepts none. --omit=dev audits what a production install would install, and today that
  # is nothing: Playwright, TypeScript and @types/node are development dependencies
  # (CONVENTIONS.md, "CI").
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node .github/audit/npm-audit.mjs
