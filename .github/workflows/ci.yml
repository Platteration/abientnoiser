name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strictly from the lockfile, so CI runs the version these tests were written against.
      - run: npm ci

      - run: npm test

      - run: npm run test:conventions

      # A static app: nothing to build. The musical and texture suites launch Chromium
      # themselves, so they follow the browser install.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:musical

      - run: npm run test:textures

      - run: npm run test:e2e

  # A job of its own, so an advisory published against an unchanged tree turns this
  # red and leaves check meaning what it always meant. No install step: the audit
  # reads the lockfile. --omit=dev because the gate is for what the app is built
  # from, and today that is nothing: Playwright, the one dependency, is a test tool.
  # high is the shared threshold (CONVENTIONS.md, "CI").
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - run: npm audit --omit=dev --audit-level=high
