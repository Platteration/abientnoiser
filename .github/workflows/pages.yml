# Publishes the app to GitHub Pages. Enable Pages for the repository
# (Settings → Pages → Source: GitHub Actions) once.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs `npm ci` and the test suites, so it gets no more than read:
# anything in the dependency tree would otherwise hold a token that can publish the
# public site and mint an OIDC identity for this repository.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A named release, as ci.yml's check job: the browser install below fails on a runner the
    # locked Playwright has no Chromium build for (test/ci.test.js).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The only git command after the checkout is the local `git archive` below;
          # without this the job's token is left in .git/config for every later step
          # to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The deploy is gated on everything CI runs, not just the unit suites: a push to
      # main that breaks the musical, texture or end-to-end checks must not publish.
      # This runs on the tree as committed, so test/shell.test.js checks the VERSION
      # the commit carries against the shell's contents before the stamp below.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:all
      # Publish the site's own files out of the commit, and nothing else: not the notes,
      # the tests, the dev server or the hosting configs, which GitHub Pages would serve as
      # files (scripts/site.js says what the site is; test/website.test.js holds it to the
      # service worker's shell). From the commit, not the working directory, which after
      # `npm ci` carries node_modules and whatever else a step left behind.
      - run: mkdir dist && git archive HEAD -- $(node scripts/site.js --list) | tar -x -C dist
      # The worker is cache-first, so a deploy only reaches existing visitors if the
      # cache name changes. Stamp the copy that is uploaded with the commit rather
      # than trusting a hand edit.
      - name: Stamp the service worker cache with this commit
        run: |
          sed -i "s/^const VERSION = .*/const VERSION = 'ambient-noiser-${GITHUB_SHA:0:8}';/" dist/sw.js
          grep -q "ambient-noiser-${GITHUB_SHA:0:8}" dist/sw.js
      # v4 and later leave out every dotfile, .well-known/security.txt with them, unless
      # include-hidden-files: true is set; test/website.test.js fails on a newer pin without it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
